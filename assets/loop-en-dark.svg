<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">How Second Read works</title>
  <desc id="desc">Write, judge with closed questions, let code decide, rewrite at most twice, deliver the best version with a report.</desc>
  <rect width="1200" height="400" rx="28" fill="#191816"/>
  <text x="600" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#A79F95">EVALUATOR-OPTIMIZER</text>
  
  <g>
    <rect x="42" y="70" width="222" height="150" rx="18" fill="#22201C" stroke="#3A3631" stroke-width="2"/>
    <circle cx="78" cy="108" r="17" fill="#F3EFE8"/>
    <text x="78" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#191816">1</text>
    <text x="106" y="117" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" fill="#F3EFE8">Write</text>
    <text x="66" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">Claude drafts it,</text>
    <text x="66" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">or you paste yours</text>
  </g>
  <g>
    <rect x="340" y="70" width="222" height="150" rx="18" fill="#22201C" stroke="#3A3631" stroke-width="2"/>
    <circle cx="376" cy="108" r="17" fill="#F0745F"/>
    <text x="376" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#191816">2</text>
    <text x="404" y="117" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" fill="#F3EFE8">Judge</text>
    <text x="364" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">Closed questions,</text>
    <text x="364" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">answered as JSON</text>
  </g>
  <g>
    <rect x="638" y="70" width="222" height="150" rx="18" fill="#22201C" stroke="#3A3631" stroke-width="2"/>
    <circle cx="674" cy="108" r="17" fill="#F3EFE8"/>
    <text x="674" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#191816">3</text>
    <text x="702" y="117" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" fill="#F3EFE8">Decide</text>
    <text x="662" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">Code and thresholds,</text>
    <text x="662" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">not the judge's mood</text>
  </g>
  <g>
    <rect x="936" y="70" width="222" height="150" rx="18" fill="#22201C" stroke="#6CC08B" stroke-width="3"/>
    <circle cx="972" cy="108" r="17" fill="#6CC08B"/>
    <text x="972" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#191816">4</text>
    <text x="1000" y="117" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" fill="#F3EFE8">Deliver</text>
    <text x="960" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">Best version</text>
    <text x="960" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A79F95">+ short report</text>
  </g>
  
  <path d="M272 145 H328" stroke="#A79F95" stroke-width="3" stroke-linecap="round"/>
  <path d="M322 138 L332 145 L322 152" fill="none" stroke="#A79F95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M570 145 H626" stroke="#A79F95" stroke-width="3" stroke-linecap="round"/>
  <path d="M620 138 L630 145 L620 152" fill="none" stroke="#A79F95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M868 135 H924" stroke="#6CC08B" stroke-width="3" stroke-linecap="round"/>
  <path d="M918 128 L928 135 L918 142" fill="none" stroke="#6CC08B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="898" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#6CC08B">accept</text><text x="898" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#A79F95">or stop</text>
  
  <path d="M749 226 V272 q0 18 -18 18 H171 q-18 0 -18 -18 V236" fill="none" stroke="#F0745F" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M146 240 L153 229 L160 240" fill="none" stroke="#F0745F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="221" y="271" width="460" height="38" rx="19" fill="#191816" stroke="#F0745F" stroke-width="2"/>
  <text x="451" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F0745F">rewrite with the judge's fixes · max 2</text>
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#A79F95">A fresh judge every round · the text is data, never instructions</text>
</svg>
